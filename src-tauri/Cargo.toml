[package]
name = "git-leviathan"
version = "0.1.0"
description = "Cliente de Git de escritorio, local y sin cuentas"
authors = ["Git Leviathan"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "git_leviathan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.2"
portable-pty = "0.9.0"
base64 = "0.22"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
